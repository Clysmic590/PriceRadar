name: Android optimized APK
on:
  push:
    branches: [main, preview-interactive-navigation]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release tag matches APK version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'versionName = "([^"]+)"', Path('app/build.gradle.kts').read_text()).group(1)
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag does not match app version'
          PY
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintRelease assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-release.*
      - uses: actions/upload-artifact@v4
        with:
          name: PriceRadar-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
  startup-smoke:
    # Disabled for 1.5.6: this release will be verified on the owner's physical device.
    if: false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: PriceRadar-APK
          path: release-assets
      - name: Enable hardware acceleration for the test emulator
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: Nexus 7
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            bash .github/scripts/android-startup-smoke.sh release-assets/app-release.apk
            python3 .github/scripts/refresh-settings-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-smoke-reports
          path: smoke-reports/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: PriceRadar-APK
          path: release-assets
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Expected a semantic version tag'
          version = tag[1:]
          assets = Path('release-assets')
          apk = assets / f'PriceRadar-{version}.apk'
          (assets / 'app-release.apk').rename(apk)
          checksums = assets / 'SHA256SUMS.txt'
          checksums.write_text(hashlib.sha256(apk.read_bytes()).hexdigest() + '  ' + apk.name + '\n')
          release_exists = subprocess.run(
              ['gh', 'release', 'view', tag],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode == 0
          if release_exists:
              subprocess.run(['gh', 'release', 'edit', tag, '--title', f'PriceRadar {version} — Bug Fix', '--notes-file', '.github/release-notes.md', '--latest'], check=True)
              subprocess.run(['gh', 'release', 'upload', tag, '--clobber', str(apk), str(checksums)], check=True)
          else:
              subprocess.run(['gh', 'release', 'create', tag, '--verify-tag', '--title', f'PriceRadar {version} — Bug Fix', '--notes-file', '.github/release-notes.md', '--latest', str(apk), str(checksums)], check=True)
          PY



