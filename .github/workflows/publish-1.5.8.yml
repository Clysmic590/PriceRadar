name: Publish PriceRadar 1.5.8
on:
  push:
    branches: [redesign-1.5]
permissions:
  contents: write
jobs:
  build-test-publish:
    if: contains(github.event.head_commit.message, '[publish-v1.5.8]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify optimized APK
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lintRelease assembleRelease --stacktrace
      - name: Tag and publish APK with SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.5.8"' app/build.gradle.kts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.5.8 -m "PriceRadar 1.5.8"
          git push origin v1.5.8
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/PriceRadar-1.5.8.apk
          sha256sum release-assets/PriceRadar-1.5.8.apk > release-assets/SHA256SUMS.txt
          gh release create v1.5.8 --verify-tag --title "PriceRadar 1.5.8 — Dashboard Fix" --notes-file .github/release-notes.md --latest release-assets/PriceRadar-1.5.8.apk release-assets/SHA256SUMS.txt

