name: Publish PriceRadar 1.5.3
on:
  push:
    branches: [redesign-1.5]
permissions:
  contents: write
jobs:
  build-test-publish:
    if: contains(github.event.head_commit.message, '[publish-v1.5.3]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify optimized APK
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lintRelease assembleRelease --stacktrace
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: Nexus 7
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            bash .github/scripts/android-startup-smoke.sh app/build/outputs/apk/release/app-release.apk
            python3 .github/scripts/refresh-settings-smoke.py
      - name: Publish APK and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/PriceRadar-1.5.3.apk
          cd release-assets
          sha256sum PriceRadar-1.5.3.apk > SHA256SUMS.txt
          cd ..
          gh release create v1.5.3 --verify-tag --title "PriceRadar 1.5.3 — One UI Settings Fix" --notes-file .github/release-notes.md --latest release-assets/PriceRadar-1.5.3.apk release-assets/SHA256SUMS.txt
